services:
  localstack:
    image: localstack/localstack:4.1.1
    container_name: event-driven-order-processing-localstack
    ports:
      - '4567:4566'
    environment:
      SERVICES: dynamodb,events,sqs
      DEBUG: '0'
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_HOST: localstack
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
