services:
  localstack:
    image: localstack/localstack:4.1.1
    container_name: event-driven-order-processing-localstack
    ports:
      - '4567:4566'
    environment:
      - SERVICES=dynamodb,events,sqs,cloudwatch,logs,iam,kms,sts,lambda,stepfunctions
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=0
      - PERSISTENCE=1
      - LOCALSTACK_HOST=localstack
      # Lets the ephemeral containers LocalStack spins up per Lambda
      # invocation join this network, so they can resolve the pushgateway
      # service by name.
      - LAMBDA_DOCKER_NETWORK=event-driven-order-processing-observability
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability

  # The services below only start with `--profile observability` (see
  # local:package.json's observability:up/down scripts and ./local.sh obs),
  # so CI -- which only ever runs `docker compose -f docker-compose.localstack.yml
  # up -d` with no profile flag -- never pulls or starts them.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: event-driven-order-processing-pushgateway
    profiles: ['observability']
    ports:
      - '9091:9091'
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: event-driven-order-processing-prometheus
    profiles: ['observability']
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - observability
    depends_on:
      - pushgateway

  loki:
    image: grafana/loki:3.3.2
    container_name: event-driven-order-processing-loki
    profiles: ['observability']
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.3.2
    container_name: event-driven-order-processing-promtail
    profiles: ['observability']
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - observability
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.1
    container_name: event-driven-order-processing-grafana
    profiles: ['observability']
    ports:
      - '3001:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      - prometheus
      - loki

networks:
  observability:
    name: event-driven-order-processing-observability

volumes:
  localstack-data:
  prometheus-data:
  loki-data:
  grafana-data:
