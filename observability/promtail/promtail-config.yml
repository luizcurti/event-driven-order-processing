server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # The local HTTP shim (scripts/localstack/server.ts) runs on the host, not
  # in Docker, so its logs are tailed from the file it writes
  # (LOG_FILE_PATH) rather than discovered as a container.
  - job_name: order-processing-local-server
    static_configs:
      - targets: ['localhost']
        labels:
          job: order-processing-local-server
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            correlationId: correlationId
            orderId: orderId
      - labels:
          level:
          service:

  # LocalStack spins up a fresh Docker container per Lambda invocation when
  # USE_REAL_LAMBDAS=true is used; this discovers and tails all containers
  # (including those ephemeral ones) via the Docker socket.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - target_label: 'job'
        replacement: 'docker'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            correlationId: correlationId
            orderId: orderId
      - labels:
          level:
          service:
