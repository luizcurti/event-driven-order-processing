name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Terraform init dev
        working-directory: terraform/environments/dev
        run: terraform init -backend=false

      - name: Terraform validate dev
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform init prod
        working-directory: terraform/environments/prod
        run: terraform init -backend=false

      - name: Terraform validate prod
        working-directory: terraform/environments/prod
        run: terraform validate

      # No AWS account is wired to this project yet. This step only runs once
      # an AWS_ROLE_ARN secret (an OIDC-assumable role, no long-lived keys)
      # is configured in the repo/environment settings; until then it fails
      # fast and is swallowed by continue-on-error so CI stays green.
      - name: Configure AWS credentials
        id: aws-creds
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform plan dev
        if: github.event_name == 'pull_request' && steps.aws-creds.outcome == 'success'
        working-directory: terraform/environments/dev
        run: terraform plan -input=false -lock=false
