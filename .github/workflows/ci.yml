name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: Format Check
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt/init/validate (dev and prod)
        run: ./scripts/terraform-check.sh

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: tflint
        run: |
          tflint --init
          # Warnings stay visible but don't fail the build -- e.g. the
          # "recommended" preset wants every module (even internal, never
          # published ones) to redeclare its own required_providers/
          # required_version, which this repo deliberately pins once at
          # the environment root instead (terraform/environments/*/versions.tf).
          tflint --recursive --chdir=terraform --minimum-failure-severity=error

      - name: Checkov (Terraform static analysis)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          # Each skipped check was reviewed and is not a real gap for this
          # architecture, not a blanket suppression:
          #   CKV_AWS_117 - no VPC-resident resource for any Lambda to reach;
          #     adding one means a NAT Gateway for zero security benefit.
          #   CKV_AWS_116 - Lambda-level DLQ only applies to asynchronous
          #     (Event) invocations. Every function here is invoked
          #     synchronously (API Gateway, Step Functions task) or via an
          #     SQS event source mapping (poll-based) -- none use async
          #     invoke, so this setting would be a no-op. The real failure
          #     path (SQS DLQ + Step Functions Catch) is already in place.
          #   CKV_AWS_173, CKV_AWS_158, CKV_AWS_119 - AWS-managed encryption
          #     already applies by default; no secret values ever reach a
          #     Lambda env var or these resources, so a customer-managed KMS
          #     key would be defense-in-depth beyond this project's scope.
          #   CKV_AWS_272 - Lambda code-signing needs a signing pipeline this
          #     repo doesn't have; disproportionate for the current threat model.
          #   CKV_AWS_338 - log retention is explicit per environment
          #     (never left as an unmanaged default), just shorter than a
          #     year in dev to match its lower cost/retention needs.
          #   CKV_AWS_120, CKV_AWS_225 - API Gateway response caching is
          #     wrong here: the API serves current order state, and caching
          #     GET responses would mean serving stale data after a mutation.
          #   CKV_AWS_192 - a log4j/Log4Shell WAF rule; this stack is
          #     Node.js/TypeScript end to end, so it's not applicable.
          #   CKV2_AWS_51 - client-certificate (mTLS) auth isn't needed for
          #     this public demo API; WAF + throttling is the chosen boundary.
          #   CKV2_AWS_53 - request validation already happens in application
          #     code (zod schemas), with 400 responses covered by tests; a
          #     parallel JSON-Schema validator at the gateway would duplicate
          #     that without adding real coverage.
          #   CKV_AWS_59 - a known, deliberate limitation, not an oversight:
          #     this API has no user/tenant model to authorize against, so
          #     there's no authorizer to add without inventing one; WAF
          #     rate-limiting is the current protection layer.
          #   CKV2_AWS_31 - WAF access logging is a reasonable future
          #     addition (see README "Next evolutions") but isn't part of
          #     this project's current observability requirements.
          #   CKV_AWS_18, CKV2_AWS_61, CKV2_AWS_62, CKV_AWS_144 - the
          #     Terraform remote-state S3 bucket (terraform/bootstrap) is
          #     applied once, by hand, outside this project's usual
          #     Terraform-managed lifecycle. Access logging, an object
          #     lifecycle policy, event notifications and cross-region
          #     replication are all real options for it, but none are
          #     needed to hold a handful of state files safely -- it
          #     already has versioning, default encryption, a public-
          #     access block and a deny-non-TLS bucket policy.
          skip_check: >-
            CKV_AWS_117,CKV_AWS_116,CKV_AWS_173,CKV_AWS_158,CKV_AWS_119,
            CKV_AWS_272,CKV_AWS_338,CKV_AWS_120,CKV_AWS_225,CKV_AWS_192,
            CKV2_AWS_51,CKV2_AWS_53,CKV_AWS_59,CKV2_AWS_31,CKV_AWS_18,
            CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_144

  e2e-localstack:
    runs-on: ubuntu-latest
    needs: validate
    env:
      LOCALSTACK_PROFILE: e2e-localstack
      LOCAL_AWS_ENDPOINT: http://localhost:4567
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Start LocalStack (Dedicated Profile)
        run: docker compose -f docker-compose.localstack.yml --profile e2e-localstack up -d

      - name: Wait for LocalStack Health
        run: curl -fsS http://localhost:4567/_localstack/health --retry 60 --retry-delay 2 --retry-all-errors --retry-connrefused > /dev/null

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: E2E Coverage Gate
        run: npm run test:e2e:coverage

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml --profile e2e-localstack down --remove-orphans

  e2e-real-lambdas:
    # Deploys the real bundled Lambda handlers and the real Step Functions
    # state machine into LocalStack (deployLambdaInfrastructure), unlike
    # e2e-localstack above which uses the fast direct-call shim that
    # bypasses Step Functions entirely. This is the only suite that
    # exercises the state machine's Retry/Catch branches, not just the
    # Lambda code each state invokes -- see
    # tests/e2e-real-lambdas/step-functions-catch.e2e.test.ts. Kept as its
    # own job (own config, own timeouts) rather than folded into
    # e2e-localstack so that suite stays fast for the common case.
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Step Functions Catch/DLQ E2E Test
        run: npm run test:e2e:real-lambdas

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml down -v --remove-orphans

  api-collection:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run Postman Collection Against Local API
        run: npm run test:api

      - name: Stop LocalStack
        if: always()
        run: docker compose -f docker-compose.localstack.yml down -v --remove-orphans

  terraform-plan:
    # Runs a real `terraform plan` for `dev` against AWS, so it needs an IAM
    # role to assume via GitHub's OIDC provider. Configure it once by setting
    # the AWS_ROLE_ARN repository variable to that role's ARN (see README ->
    # CI/CD) -- a role ARN isn't sensitive by itself (the role's trust policy
    # is what actually gates access), so it's a variable, not a secret, and
    # can safely be read in this `if:` condition. Until it's set, this job
    # skips cleanly instead of failing.
    #
    # head.repo.full_name == repository excludes fork-originated PRs: `plan`
    # evaluates provider/data-source code (e.g. a "data external" block runs
    # arbitrary local commands during plan, not just apply), and the AWS
    # credentials assumed below are already in this job's environment by the
    # time that runs -- without this check, a PR from a fork could add such
    # a block to terraform/environments/dev/*.tf to exfiltrate them. Even a
    # read-only-by-convention role would still mean live credential theft.
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Package Lambda artifacts
        run: npm run package:artifacts

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init (dev)
        # Uses the real S3 backend once TF_STATE_BUCKET/TF_STATE_LOCK_TABLE
        # repository variables are set (see terraform/bootstrap and the
        # README's "Remote state" section), so `plan` diffs against
        # previously applied infrastructure. Until then, this writes a
        # local-backend override (Terraform's `*_override.tf` mechanism)
        # instead of passing `-backend=false`: once a config declares a
        # real `backend "s3" {}` block (versions.tf does), `-backend=false`
        # only satisfies `init` itself -- a later state-consuming command
        # like `plan` still finds that block and refuses to run without a
        # real backend or a matching reconfiguration. An override that
        # redeclares the backend as `local` is what actually lets `plan`
        # run against ephemeral state, so this job keeps working before the
        # real backend is configured, plan-from-scratch as documented.
        run: |
          if [ -n "${{ vars.TF_STATE_BUCKET }}" ]; then
            terraform -chdir=terraform/environments/dev init -input=false \
              -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
              -backend-config="key=dev/terraform.tfstate" \
              -backend-config="region=us-east-1" \
              -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
              -backend-config="encrypt=true"
          else
            printf 'terraform {\n  backend "local" {}\n}\n' > terraform/environments/dev/ci_local_backend_override.tf
            terraform -chdir=terraform/environments/dev init -input=false
          fi

      - name: Terraform Plan (dev)
        run: |
          set -o pipefail
          terraform -chdir=terraform/environments/dev plan -input=false -no-color 2>&1 | tee /tmp/plan-output.txt

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outputPath = '/tmp/plan-output.txt';
            if (!fs.existsSync(outputPath)) return;

            let body = fs.readFileSync(outputPath, 'utf8');
            const maxLength = 60000;
            if (body.length > maxLength) {
              body = body.slice(0, maxLength) + '\n... (truncated)';
            }

            const marker = '<!-- terraform-plan-dev -->';
            const commentBody = `${marker}\n### Terraform Plan (dev)\n\`\`\`\n${body}\n\`\`\``;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body: commentBody
              });
            }

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate, e2e-localstack, e2e-real-lambdas, api-collection]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform fmt/init/validate (dev and prod)
        run: ./scripts/terraform-check.sh
