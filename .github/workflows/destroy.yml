name: Destroy

# Manually tears down terraform/environments/dev in real AWS to stop paying for it
# while unused. Recreate it with the CI-CD workflow's "Run workflow" button (or any
# push to main). The terraform/bootstrap resources (state bucket, lock table, deploy
# role) are kept.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to delete every AWS resource of the dev environment (DynamoDB data included)'
        required: true
        type: string

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      TF_DIR: terraform/environments/dev
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_alarm_notification_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_lambda_reserved_concurrency: ${{ vars.LAMBDA_RESERVED_CONCURRENCY || '-1' }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error title=Not confirmed::Type exactly \"destroy\" to run this workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      # main.tf points every function at artifacts/<name>.zip; the code is irrelevant
      # to a destroy, so placeholders avoid a full npm install + bundle.
      - name: Placeholder Lambda artifacts
        run: |
          mkdir -p artifacts
          echo "placeholder for terraform destroy" > artifacts/README.txt
          for fn in create-order get-order list-orders cancel-order inventory payment fraud shipping notification update-order; do
            (cd artifacts && zip -q "${fn}.zip" README.txt)
          done

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init (S3 remote state)
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform Destroy
        shell: bash # bash -eo pipefail, so `| tee` keeps Terraform's exit code
        run: terraform -chdir="$TF_DIR" destroy -auto-approve -input=false -no-color 2>&1 | tee destroy.log

      - name: Report Terraform errors
        if: failure()
        run: |
          [ -f destroy.log ] || exit 0
          awk '{ gsub(/%/, "%25") }
               /^Error: / { if (buf) print buf; buf = $0; n = 0; next }
               buf && n < 15 { buf = buf "%0A" $0; n++ }
               END { if (buf) print buf }' destroy.log |
            while IFS= read -r block; do echo "::error title=Terraform (destroy.log)::${block}"; done

      - name: Summary
        run: |
          echo "### dev destroyed :wastebasket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Recreate it with **Actions -> CI-CD -> Run workflow** on \`main\`." >> "$GITHUB_STEP_SUMMARY"
